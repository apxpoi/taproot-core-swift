name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (macOS, Swift 6.2)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Swift Version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6.2-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Run All Tests
        run: swift test --parallel

      - name: Build taproot-core-swift (Debug)
        run: swift build --product taproot-core-swift

      - name: Build taproot-core-swift (Release)
        run: swift build -c release --product taproot-core-swift

  build-cli-binaries:
    needs: build-and-test
    uses: ./.github/workflows/build-cli-artifacts.yml
    with:
      artifact-retention-days: 14
