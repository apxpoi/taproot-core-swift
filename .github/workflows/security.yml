name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-swift:
    name: CodeQL (Swift)
    strategy:
      matrix:
        os: [macos-latest]
        swift: ["6.2"]
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Swift ${{ matrix.swift }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for Analysis
        run: |
          swift package resolve
          swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
