name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-swift:
    name: CodeQL (Swift)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Swift (latest stable)
        uses: swift-actions/setup-swift@v2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build for Analysis
        run: |
          swift package resolve
          swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  codeql-actions:
    name: CodeQL (Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
